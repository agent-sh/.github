name: CI - agnix

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  agnix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate agent configurations
        uses: agent-sh/agnix@v0.16.5
        with:
          config: '.agnix.toml'
          fail-on-error: 'true'
